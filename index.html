
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English (US)</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #ffffff;
  font-family: Arial, sans-serif;
  color: #262626;
}

.demo-label {
  background: #fff3cd;
  color: #856404;
  text-align: center;
  padding: 8px;
  font-size: 11px;
}

.language {
  text-align: center;
  margin-top: 35px;
  color: #8e8e8e;
  font-size: 14px;
}

.logo {
  text-align: center;
  margin-top: 55px;
  margin-bottom: 85px;
  font-family: cursive;
  font-size: 42px;
  color: #262626;
}

.login {
  width: 85%;
  max-width: 350px;
  margin: auto;
}

input {
  width: 100%;
  height: 52px;
  margin-bottom: 12px;
  padding: 0 15px;
  background: #fafafa;
  border: 1px solid #dbdbdb;
  border-radius: 4px;
  font-size: 14px;
}

.forgot {
  text-align: right;
  color: #385185;
  font-size: 14px;
  margin-top: 8px;
  margin-bottom: 55px;
}

.login-button {
  width: 100%;
  height: 48px;
  background: #4a9df8;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  font-weight: bold;
}

.signup {
  text-align: center;
  margin-top: 55px;
  font-size: 14px;
  color: #737373;
}

.signup span {
  color: #3897f0;
  font-weight: bold;
}

.reveal {
  display: none;
  width: 85%;
  max-width: 350px;
  margin: 25px auto;
  padding: 18px;
  border: 1px solid #ffcc80;
  background: #fff8e1;
  border-radius: 6px;
  font-size: 14px;
  line-height: 1.6;
}

.reveal h3 {
  margin-top: 0;
  color: #b45309;
}

</style>
</head>

<body>

<div class="demo-label">
  Instagram Login page
</div>

<div class="language">
  English ⌄
</div>

<div class="logo">
  Instagram
</div>

<div class="login">

  <input
    type="text"
    placeholder="Phone number, username, or email"
    disabled
  >

  <input
    type="password"
    placeholder="Password"
    disabled
  >

  <div class="forgot">
    Forgot password?
  </div>

  <button
    class="login-button"
    onclick="showDemo()"
  >
    Log in
  </button>

</div>

<div class="signup">
  Don't have an account?
  <span>Sign up</span>
</div>

<div class="reveal" id="reveal">
  <h3>Unknown Error Occurred</h3>

  This page is no longer available 
  <br><br>

  Can't Login your account.
  Try again after some time.
</div>

<script>
function showDemo() {
  document.getElementById("reveal").style.display = "block";
}
</script>

</body>
</html>
